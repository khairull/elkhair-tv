plugins {
    id 'com.android.application'
}

android {
    namespace 'id.elkhair.sholat'
    compileSdk 34

    defaultConfig {
        applicationId 'id.elkhair.sholat'
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName '1.0-gtlo'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
