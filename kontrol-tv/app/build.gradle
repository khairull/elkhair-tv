plugins { id 'com.android.application' }
android {
    namespace 'id.elkhair.kontroltv'
    compileSdk 34
    defaultConfig { applicationId 'id.elkhair.kontroltv'; minSdk 26; targetSdk 34; versionCode 19; versionName '1.0' }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'); signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
